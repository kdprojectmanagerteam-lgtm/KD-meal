const localDateStr = (d = new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt = (n) => '$' + Math.abs(n).toLocaleString();
const fmtS = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString();
const getWeekday = (s) => ['日','一','二','三','四','五','六'][new Date(s+'T00:00').getDay()];
const stripEng = (s) => { let r=s.replace(/◆/g,''); const pm=r.match(/\$\d+/); const price=pm?pm[0]:''; r=r.replace(/\$\d+/,''); r=r.replace(/\s*\([A-Za-z0-9][A-Za-z0-9\s,&'.+-]*\)/g,''); r=r.replace(/\s*[A-Za-z][A-Za-z\s,&'.+-]*/g,''); r=r.replace(/\s{2,}/g,' ').trim(); return r+(price?' '+price:''); };
const getTimeRemaining = (dl) => {
  if (!dl) return null;
  const t = Date.parse(dl) - Date.now();
  if (t <= 0) return { total: 0, days: 0, hours: 0, minutes: 0 };
  return { total: t, days: Math.floor(t/86400000), hours: Math.floor((t/3600000)%24), minutes: Math.floor((t/60000)%60) };
};
const getNextFiveWorkDays = (s = new Date()) => {
  const d = []; let c = new Date(s);
  while (d.length < 5) { if (c.getDay()%6!==0) d.push(localDateStr(c)); c.setDate(c.getDate()+1); }
  return d;
};
const getNowISO = () => { const n = new Date(); return new Date(n - n.getTimezoneOffset()*60000).toISOString().slice(0,16); };
const getDefaultDeadline = (ds, type) => {
  if (!ds) return '';
  if (type === '早餐') { let p = new Date(ds+'T00:00'); p.setDate(p.getDate()-1); while(p.getDay()%6===0) p.setDate(p.getDate()-1); return localDateStr(p)+'T16:00'; }
  if (type === '午餐') return ds+'T09:30';
  if (type === '晚餐') return ds+'T14:30';
  return ds+'T10:10';
};

// --- Countdown ---
const CountdownBadge = ({ deadline }) => {
  const [tl, setTl] = useState(getTimeRemaining(deadline));
  useEffect(() => { setTl(getTimeRemaining(deadline)); }, [deadline]);
  useEffect(() => { const t = setInterval(() => setTl(getTimeRemaining(deadline)), 60000); return () => clearInterval(t); }, [deadline]);
  if (!tl || tl.total <= 0) return <div className="flex items-center gap-1 px-2 md:px-3 py-1 bg-red-50 text-red-600 rounded-full text-xs md:text-sm font-black border border-red-100"><Icon name="lock" size={14}/> 已截止</div>;
  return <div className="flex items-center gap-1 px-2 md:px-3 py-1 bg-blue-50 text-blue-900 rounded-full text-sm font-black border border-blue-100 shrink-0"><Icon name="timer" size={14}/>截止倒數：{tl.days>0&&tl.days+'天 '}{tl.hours}時 {tl.minutes}分</div>;
};

              const baseMatch=c.name.match(/\$(\d+)/);
              const basePrice=baseMatch?parseInt(baseMatch[1]):(c._basePrice||c.price);
              price=basePrice+tpTotal;
            }
          }
          if (c.type==='早餐' && c.remarks) {
            const baseMatch=c.name.match(/\$(\d+)/);const basePrice=baseMatch?parseInt(baseMatch[1]):0;
            if(basePrice && price===basePrice){
              const addonMatches=[...c.remarks.matchAll(/\+\$(\d+)/g)];
              addonMatches.forEach(m=>{price+=parseInt(m[1]);});
            }
          }
          return {date:c.orderDate,type:c.type,item_name:c.name,qty:c.qty,price,remarks:c.remarks||'',self_paid:c.self_paid===1?1:0};
        });
        const orderEmpId = proxyForOther ? proxyTarget.id : empInfo.id;
        const orderEmpName = proxyForOther ? proxyTarget.name : empInfo.name;
        const proxyByName = proxyForOther ? empInfo.name : undefined;
        const dateTypes = [...new Set(items.map(i=>i.date+'|'+i.type))];
        for (const dt of dateTypes) {
          const [d, t] = dt.split('|');
          const existing = await api.getOrders({emp_id: orderEmpId, date: d, type: t});
          if (existing.length > 0) {
            const existNames = existing.map(o=>o.item_name).join('、');
            const newNames = items.filter(i=>i.date===d&&i.type===t).map(i=>{const m=i.item_name.match(/\$(\d+)/);const base=m?parseInt(m[1]):0;return i.price!==base?i.item_name.replace(/\$\d+/,'$'+i.price):i.item_name;}).join('、');
            if (!confirm(d + ' ' + t + (proxyForOther?' '+proxyTarget.name:'') + ' 已點過 Already ordered:\n' + existNames + '\n\n確定要再加點 Confirm additional order:\n' + newNames)) return;
            // 晚餐：DB已有公司付 → 本次全部強制自費
            if (t === '晚餐' && existing.some(o => o.self_paid === 0)) {
              items.filter(i=>i.date===d&&i.type==='晚餐').forEach(i=>{ i.self_paid = 1; });
            }
          }
        }
        await api.createOrders({emp_id:orderEmpId,emp_name:orderEmpName,floor:proxyForOther?proxyTarget.floor:empInfo.floor,proxy_by:proxyByName,paid_by:treatBy.enabled?treatBy.id:undefined,paid_by_name:treatBy.enabled?treatBy.name:undefined,treat_reason:treatBy.enabled&&treatBy.type==='company'?treatBy.reason||undefined:undefined,items});
      }
      // 廠商訂單（按公司+部門分組）
      if (guestItems.length > 0) {
        const guestGroups = {};
        guestItems.forEach(c => {
          const gk = (c._company||'') + '|' + (c._guestDept||'');
          if (!guestGroups[gk]) guestGroups[gk] = {company:c._company,dept:c._guestDept,qty:c._guestQty,items:[]};
          guestGroups[gk].items.push(c);
        });
        for (const g of Object.values(guestGroups)) {
          const items = g.items.map(c=>{
            let price=c.price;
            if(c.type==='飲料'){const tpSel=drinkSelections[c.orderDate]?.toppings||[];if(tpSel.length>0){const allTp=drinkOptions.filter(o=>o.date===c.orderDate).flatMap(o=>o.toppings||[]);const tpTotal=tpSel.reduce((s,n)=>{const t=allTp.find(x=>x.name===n);return s+(t?t.price:0);},0);const bm=c.name.match(/\$(\d+)/);price=(bm?parseInt(bm[1]):(c._basePrice||c.price))+tpTotal;}}
            return {date:c.orderDate,type:c.type,item_name:c.name,qty:c.qty,price,remarks:c.remarks||'',self_paid:c.self_paid===1?1:0};
          });
          await api.createOrders({emp_id:g.company,emp_name:g.company,floor:empInfo.floor,company_name:g.company,guest_dept:g.dept,guest_qty:g.qty||1,proxy_by:empInfo.name,items});
        }
      }
      const wasProxy = proxyForOther;
      const proxyName = proxyTarget.name;
      setCart({}); setShowSubmit(false); setBfSelections({}); setDrinkSelections({});
      setUserType('employee'); setEmpInfo(prev=>({...prev,company:'',guestDept:'',guestQty:1})); setGuestDeptSel('');
      if(wasProxy){setProxyForOther(false);setProxyTarget({id:'',name:''});setProxyTargetSearch('');}
      setTreatBy({enabled:false,type:'',id:'',name:''}); setTreatBySearch(''); setTreatByResults([]);
      setQueryFilter(prev => ({...prev, empId: empInfo.id}));
      alert(wasProxy ? '已成功幫 '+proxyName+' 代點餐！' : '訂單提交成功！\nOrder submitted successfully!');
      setActiveTab('history');
    } catch(e) { alert(e.message); } finally { setIsSubmitting(false); }
  };

                      </div>
                      <span className="px-2.5 py-1 rounded-full text-xs font-black bg-green-50 text-green-700">已簽收</span>
                    </div>
                  ))}
                  {uniformAllApps.filter(a=>a.status==='received').length===0 && <div className="py-8 text-center text-slate-300 text-sm">目前沒有已簽收的紀錄</div>}
                </div>
              </div>
            </div>)}

            {/* 權限管理 (super_admin) */}
            {/* 歷史紀錄查詢 (HR) — 查所有員工領用明細 */}
            {uniformAdminTab==='history_all' && (
              <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                <div className="px-6 py-3 bg-slate-50 border-b font-black text-sm text-slate-700 flex items-center gap-3">
                  <span>歷史紀錄查詢</span>
                  <input value={uniformAdminSearch||''} onChange={e=>setUniformAdminSearch(e.target.value)} className="p-2 bg-white rounded-xl text-sm font-bold outline-none border border-slate-200 w-48" placeholder="搜尋工號或姓名"/>
                </div>
                <div className="divide-y">
                  {(()=>{
                    const kw = (uniformAdminSearch||'').trim();
                    const filtered = kw ? uniformAllApps.filter(a=>a.emp_name.includes(kw)||a.emp_id.includes(kw)) : uniformAllApps;
                    return filtered.length > 0 ? filtered.map(a=>{
                      const st = statusMap[a.status]||{label:a.status,color:'slate'};
                      return (
                        <div key={a.id} className="p-4 space-y-1">
                          <div className="flex items-center justify-between">
                            <div>
                              <span className="text-sm font-black text-slate-700">{a.emp_name}</span>
                              <span className="text-xs text-slate-400 ml-2">{a.emp_id} | {a.location}</span>
                            </div>
                            <span className={'px-2.5 py-1 rounded-full text-xs font-black bg-'+st.color+'-50 text-'+st.color+'-700'}>{st.label}</span>
                          </div>
                          <div className="text-sm text-slate-600">{a.uniform_type==='A_shirt'?'A 襯衫':'B POLO衫'} | 尺寸 {a.selected_size} | 長袖 {a.long_sleeve_qty} + 短袖 {a.short_sleeve_qty} | {a.outerwear_type==='blazer'?'西裝外套×1':'夾克×2'}</div>
                          <div className="text-xs text-slate-400">申請 {a.created_at?.slice(0,10)}{a.received_at ? ' | 簽收 '+a.received_at.slice(0,10) : ''}</div>
                        </div>
                      );
                    }) : <div className="py-12 text-center text-slate-300 text-sm">{kw?'查無符合的紀錄':'尚無申請紀錄'}</div>;
                  })()}
                </div>
              </div>
            )}

            {/* 缺貨調撥 (Warehouse) — 庫存不足需要從嘉義總庫調撥的項目 */}
            {uniformAdminTab==='shortage' && (
              <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                <div className="px-6 py-3 bg-amber-50 border-b font-black text-sm text-amber-700">缺貨調撥 Shortage & Transfer</div>
                <div className="divide-y">
                  {(()=>{
                    // 找出已核准但當地庫存不足的申請
                    const pending = uniformAllApps.filter(a=>a.status==='approved');
                    if (!pending.length) return <div className="py-12 text-center text-slate-300 text-sm">目前沒有需要調撥的項目</div>;
                    // 按據點分組
                    const byLoc = {};
                    pending.forEach(a=>{if(!byLoc[a.location])byLoc[a.location]=[];byLoc[a.location].push(a);});
                    return Object.entries(byLoc).map(([loc, apps])=>(
                      <div key={loc} className="p-4 space-y-2">
                        <div className="font-black text-slate-700">{loc} <span className="text-xs text-slate-400">({apps.length} 筆待發)</span></div>
                        {apps.map(a=>(
                          <div key={a.id} className="ml-4 flex items-center justify-between text-sm">
                            <div>
                              <span className="font-bold text-slate-700">{a.emp_name}</span>
                              <span className="text-slate-500 ml-2">{a.uniform_type==='A_shirt'?'襯衫':'POLO衫'} {a.selected_size} | 長袖{a.long_sleeve_qty} 短袖{a.short_sleeve_qty}</span>
                            </div>
                            <button onClick={async()=>{if(!confirm('從嘉義總庫調撥並標記 '+a.emp_name+' 已出貨？'))return;await api.updateUniformApp(a.id,{status:'shipped',shipped_by:empInfo.name+' (總庫調撥)'});api.getUniformApps({}).then(setUniformAllApps);}} className="px-3 py-1 bg-amber-500 text-white rounded-lg text-xs font-black shrink-0">調撥出貨</button>
                          </div>
                        ))}
                      </div>
                    ));
                  })()}
                </div>
              </div>
            )}

            {/* 據點總覽 (General Affairs) — 各據點庫存與發放狀況 */}
            {uniformAdminTab==='overview' && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                  <div className="px-6 py-3 bg-slate-50 border-b font-black text-sm text-slate-700">各據點發放狀況</div>
                  <div className="divide-y">
                    {(()=>{
                      const locStats = {};
                      uniformAllApps.forEach(a=>{
                        if(!locStats[a.location]) locStats[a.location]={pending:0,approved:0,shipped:0,received:0,total:0};
                        locStats[a.location][a.status]=(locStats[a.location][a.status]||0)+1;
                        locStats[a.location].total++;
                      });
                      const entries = Object.entries(locStats);
                      return entries.length > 0 ? entries.map(([loc, s])=>(
                        <div key={loc} className="p-4 flex items-center justify-between">
                          <span className="text-sm font-black text-slate-700">{loc}</span>
                          <div className="flex gap-2">
                            {s.pending>0 && <span className="px-2 py-0.5 rounded-full text-xs font-black bg-yellow-50 text-yellow-700">待審核 {s.pending}</span>}
                            {s.approved>0 && <span className="px-2 py-0.5 rounded-full text-xs font-black bg-blue-50 text-blue-700">已核准 {s.approved}</span>}
                            {s.shipped>0 && <span className="px-2 py-0.5 rounded-full text-xs font-black bg-purple-50 text-purple-700">已出貨 {s.shipped}</span>}
                            {s.received>0 && <span className="px-2 py-0.5 rounded-full text-xs font-black bg-green-50 text-green-700">已簽收 {s.received}</span>}
                            <span className="text-xs text-slate-400">共 {s.total} 筆</span>
                          </div>
                        </div>
                      )) : <div className="py-12 text-center text-slate-300 text-sm">尚無資料</div>;
                    })()}
                  </div>
                </div>
                {/* 庫存概覽 */}
                <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                  <div className="px-6 py-3 bg-slate-50 border-b font-black text-sm text-slate-700">各據點庫存概覽</div>
                  <div className="divide-y">
                    {(()=>{
                      const byLoc = {};
                      uniformInventory.forEach(inv=>{
                        if(!byLoc[inv.location]) byLoc[inv.location]=0;
                        byLoc[inv.location]+=inv.quantity;
                      });
                      const entries = Object.entries(byLoc);
                      return entries.length > 0 ? entries.map(([loc, total])=>(
                        <div key={loc} className="p-4 flex items-center justify-between">
                          <span className="text-sm font-black text-slate-700">{loc}</span>
                          <span className={'text-sm font-black '+(total<=10?'text-red-600':total<=30?'text-amber-600':'text-slate-700')}>{total} 件</span>
                        </div>
                      )) : <div className="py-12 text-center text-slate-300 text-sm">尚未建立庫存資料</div>;
                    })()}
                  </div>
                </div>
              </div>
            )}

            {uniformAdminTab==='permissions' && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl border shadow-sm">
                  <div className="px-6 py-3 bg-slate-50 border-b rounded-t-3xl font-black text-sm text-slate-700">新增角色 Add Role</div>
                  <div className="p-4 space-y-3">
                    <div className="space-y-1 relative">
                      <label className="text-sm font-black text-slate-400">搜尋同仁</label>
                      <input value={uniformRoleSearch} onChange={e=>{
                        const v=e.target.value;setUniformRoleSearch(v);
                        if(v.length>=1){api.searchEmployees(v).then(r=>{setUniformRoleResults(r);setUniformRoleShowList(true);}).catch(()=>{});}
                        else{setUniformRoleResults([]);setUniformRoleShowList(false);}
                      }} onFocus={()=>{if(uniformRoleResults.length>0)setUniformRoleShowList(true);}} className="w-full p-3 bg-slate-50 rounded-xl font-bold outline-none text-sm"/>
                      {uniformRoleShowList && uniformRoleResults.length>0 && (
                        <div className="absolute z-20 top-full left-0 right-0 mt-1 bg-white border rounded-xl shadow-lg max-h-48 overflow-y-auto">
                          {uniformRoleResults.map((emp,i)=>(
                            <div key={i} onClick={()=>{setUniformRoleSearch(emp.name+' ('+emp.account_id+')');setUniformRoleShowList(false);setUniformRoleResults([{...emp,_selected:true}]);}} className="px-4 py-2.5 hover:bg-blue-50 cursor-pointer flex justify-between items-center border-b last:border-b-0">
                              <span className="font-bold text-slate-700">{emp.name}</span>
                              <span className="text-xs text-slate-400">{emp.account_id}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    {uniformRoleResults.length===1 && uniformRoleResults[0]._selected && (()=>{
                      const sel = uniformRoleResults[0];
                      const roleOptions = [{id:'hr',label:'人資 HR'},{id:'local_admin',label:'當地窗口 Local Admin'},{id:'warehouse',label:'嘉義總庫/生管 Warehouse'},{id:'procurement',label:'採購 Procurement'},{id:'general_affairs',label:'總務 General Affairs'},{id:'super_admin',label:'系統管理員 Super Admin'}];
                      return (
                        <div className="space-y-3 p-3 bg-blue-50 rounded-xl">
                          <div className="text-sm font-black text-slate-700">{sel.name} ({sel.account_id})</div>
                          <div className="space-y-1">
                            <label className="text-sm font-black text-slate-400">角色</label>
                            <select value={uniformNewRole} onChange={e=>setUniformNewRole(e.target.value)} className="w-full p-2.5 bg-white rounded-xl text-sm font-bold border-none outline-none">
                              {roleOptions.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
                            </select>
                          </div>
                          {uniformNewRole==='local_admin' && (
                            <div className="space-y-1">
                              <label className="text-sm font-black text-slate-400">負責據點</label>
                              <select value={uniformNewLoc} onChange={e=>setUniformNewLoc(e.target.value)} className="w-full p-2.5 bg-white rounded-xl text-sm font-bold border-none outline-none">
                                <option value="">請選擇</option>
                                {locations.map(l=><option key={l} value={l}>{l}</option>)}
                              </select>
                            </div>
                          )}
                          <button onClick={async()=>{
                            if(uniformNewRole==='local_admin'&&!uniformNewLoc)return alert('請選擇據點');
                            await api.createUniformRole({emp_id:sel.account_id,emp_name:sel.name,role:uniformNewRole,location:uniformNewRole==='local_admin'?uniformNewLoc:null});
                            setUniformRoleSearch('');setUniformRoleResults([]);setUniformNewRole('hr');setUniformNewLoc('');
                            api.getUniformRoles().then(setUniformAllRoles);
                            alert('角色已設定');
                          }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-black">確認設定</button>
                        </div>
                      );
                    })()}
                  </div>
                </div>

                <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                  <div className="px-6 py-3 bg-slate-50 border-b font-black text-sm text-slate-700">已設定角色 ({uniformAllRoles.length})</div>
                  <div className="divide-y">
                    {(()=>{
                      const roleLabels = {hr:'人資 HR',local_admin:'當地窗口',warehouse:'嘉義總庫/生管',procurement:'採購',general_affairs:'總務',super_admin:'系統管理員'};
                      const roleColors = {hr:'blue',local_admin:'purple',warehouse:'amber',procurement:'emerald',general_affairs:'slate',super_admin:'red'};
                      return uniformAllRoles.map(r=>(
                        <div key={r.id} className="px-4 py-3 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-black text-slate-700">{r.emp_name}</span>
                            <span className="text-xs text-slate-400">{r.emp_id}</span>
                            <span className={'px-2 py-0.5 rounded-full text-xs font-black bg-'+(roleColors[r.role]||'slate')+'-50 text-'+(roleColors[r.role]||'slate')+'-700'}>{roleLabels[r.role]||r.role}</span>
                            {r.location && <span className="text-xs text-slate-400">{r.location}</span>}
                          </div>
                          <button onClick={async()=>{if(!confirm('移除 '+r.emp_name+' 的角色？'))return;await api.deleteUniformRole(r.id);api.getUniformRoles().then(setUniformAllRoles);}} className="text-red-400 hover:text-red-600 text-xs font-black">移除</button>
                        </div>
                      ));
                    })()}
                    {uniformAllRoles.length===0 && <div className="py-8 text-center text-slate-300 text-sm">尚未設定任何角色</div>}
                  </div>
                </div>
              </div>
            )}
          </>;})()}
        </div>
        </div>
        </>);
      })()}

    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
